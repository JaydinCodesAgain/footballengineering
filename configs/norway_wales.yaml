match_id: norway_wales
match_name: "Norway vs Wales"
video_path: "data/raw/Norway vs Wales _ HIGHLIGHTS _ UEFA Nations League.mp4"
fallback_video_paths:
  - "Norway vs Wales _ HIGHLIGHTS _ UEFA Nations League.mp4"

label_mapping:
  Team_A: "Norway"
  Team_B: "Wales"
  Referee: "REF"
  Unknown: "Unknown"

label_aliases:
  Norway: "Team_A"
  Wales: "Team_B"
  REF: "Referee"
  Other: "Unknown"
  Unknown: "Unknown"

team_colours_bgr:
  Team_A: [0, 0, 255]        # Red (BGR) for Norway
  Team_B: [255, 120, 0]      # Distinct Blue/Orange (BGR) for Wales
  Referee: [0, 255, 255]     # Yellow (BGR) for Referee
  Unknown: [160, 160, 160]   # Grey (BGR) for Unknown

detection:
  model_name: "yolo11n.pt"
  imgsz: 1088
  person_conf: 0.40
  ball_conf: 0.20
  frame_stride: 2
  iou_threshold: 0.50
  enable_roi_ball_search: true
  roi_size_px: 640
  roi_conf_threshold: 0.14
  enable_tiled_ball_search: false
  tile_conf_threshold: 0.16
  min_ball_box_size_px: 5
  max_ball_box_size_px: 140
  filter_false_positive_balls: true

cropping:
  min_player_height: 30
  min_player_width: 12
  min_crop_width: 8
  min_crop_height: 10
  left_frac: 0.25
  right_frac: 0.75
  top_frac: 0.18
  bottom_frac: 0.55
  min_blur_variance: 6.0
  max_grass_ratio: 0.80
  max_occlusion_ratio: 0.65

classification:
  feature_method: "foreground_masked"
  classifier_type: "knn"
  n_neighbors: 3
  metric: "cosine"
  unknown_threshold: 0.35
  auto_calibrate_threshold: true
  min_margin: 0.02
  balance_class_weights: true
  random_state: 42

tracking:
  tracker_config: "bytetrack.yaml"
  start_frame: 1620
  history_length: 9
  min_votes: 3
  min_agreement: 0.60
  confidence_weighted: true
  lock_confidence_threshold: 0.78
  lock_min_observations: 6
  reclassify_contradiction_streak: 5
  max_missing_frames_before_reset: 30
  max_spatial_jump_ratio: 3.5

splits:
  train_end_fraction: 0.40
  val_start_fraction: 0.55
  val_end_fraction: 0.80
  test_start_fraction: 0.80

ball_tracking:
  max_coast_frames: 5
  max_jump_px_per_frame: 165.0
  reacquire_confirm_frames: 2
  velocity_damping: 0.85
  interpolation_conf_decay: 0.78
  camera_cut_hist_threshold: 0.52

possession:
  enabled: true
  control_distance_threshold: 1.35
  contested_distance_threshold: 1.15
  contested_margin_threshold: 0.22
  loose_ball_speed_threshold_px_s: 520.0
  min_control_frames: 2
  max_pass_retention_frames: 6
  min_ownership_confidence: 0.28
  exclude_referees: true
  attribute_unknown_goalkeepers: false
  pitch_y_min_frac: 0.08
  pitch_y_max_frac: 0.96
  pitch_x_min_frac: 0.02
  pitch_x_max_frac: 0.98

